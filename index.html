<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dai Jinhang</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden; /* 禁止滚动，保持单屏 */
    background: #0a0a12;
    font-family: 'Helvetica Neue', Arial, 'Segoe UI', sans-serif;
  }

  /* ====== 背景动态渐变层 ====== */
  .bg-gradient {
    position: fixed;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.35), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.28), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(45, 212, 191, 0.22), transparent 50%);
    filter: blur(60px);
    animation: floatBg 16s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes floatBg {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(3%, -4%) scale(1.08); }
    100% { transform: translate(-3%, 4%) scale(1.02); }
  }

  /* ====== 鼠标跟随光晕，跟随鼠标移动，用 JS 控制 --mx --my ====== */
  .cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 600px;
    height: 600px;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    transform: translate(calc(var(--mx, 50vw) - 300px), calc(var(--my, 50vh) - 300px));
    z-index: 1;
    transition: transform 0.12s ease-out;
  }

  /* ====== 星点闪烁背景（可删除这一整块 .stars 相关代码来去掉星星效果） ====== */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 85% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, rgba(255,255,255,0.3), transparent);
    background-repeat: repeat;
    background-size: 100% 100%;
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0%   { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* ====== 主内容容器 ====== */
  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }

  /* ====== 大标题 “Hi, I'm Dai Jinhang” —— 如需修改姓名，改这里的文字内容（在 HTML body 里，不是这段 CSS） ====== */
  .title {
    font-size: clamp(2.8rem, 7vw, 6.5rem);
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffffff, #a5b4fc, #f0abfc, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite, riseIn 1s ease-out;
  }

  @keyframes shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes riseIn {
    0%   { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ====== 小字副标题 —— 如需修改文字，去下面 HTML body 中找 .subtitle 标签 ====== */
  .subtitle {
    margin-top: 18px;
    font-size: clamp(0.95rem, 1.6vw, 1.3rem);
    color: rgba(255, 255, 255, 0.65);
    letter-spacing: 0.5px;
    animation: riseIn 1.2s ease-out;
  }

  /* ====== 按钮区域容器 ====== */
  .btn-group {
    margin-top: 46px;
    display: flex;
    gap: 24px;
    animation: riseIn 1.4s ease-out;
  }

  /* ====== 按钮通用样式 —— 想改按钮颜色/大小/圆角，在这里改 ====== */
  .btn {
    position: relative;
    padding: 14px 34px;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
  }

  /* 鼠标悬停按钮时的动效，可调整位移/发光强度 */
  .btn:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 30px rgba(165, 180, 252, 0.35);
  }

  /* 按钮内部的流光扫过效果 */
  .btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }

  .btn:hover::before {
    left: 125%;
  }

  /* 主按钮（例如 Google Scholar）可单独换个强调色，改这里的 background/border */
  .btn.primary {
    background: linear-gradient(90deg, rgba(99,102,241,0.35), rgba(236,72,153,0.3));
    border-color: rgba(255, 255, 255, 0.35);
  }

</style>
</head>
<body>

  <!-- 背景装饰层，不需要改动 -->
  <div class="bg-gradient"></div>
  <div class="stars"></div>
  <div class="cursor-glow"></div>

  <!-- ====== 主内容区域 ====== -->
  <div class="container">

    <!-- 大标题：想改名字，直接改下面双引号里的英文文字 -->
    <h1 class="title">Hi, I'm Dai Jinhang</h1>

    <!-- 副标题小字：想改文字，直接改下面这一行 -->
    <p class="subtitle">2026 &middot; M.S. in Artificial Intelligence, Shenzhen University</p>

    <!-- ====== 按钮区：跳转链接在 href="..." 里改，按钮文字在 <a> 标签中间改 ====== -->
    <div class="btn-group">

      <!-- 按钮1：Google Scholar —— 把 href 换成你自己的 Google Scholar 主页链接 -->
      <a class="btn primary" href="https://scholar.google.com/citations?user=你的ID" target="_blank" rel="noopener noreferrer">
        Google Scholar
      </a>

      <!-- 按钮2：CV —— 把 href 换成你的简历文件链接（可以是网盘链接，或仓库里 CV.pdf 的路径） -->
      <a class="btn" href="CV.pdf" target="_blank" rel="noopener noreferrer">
        CV
      </a>

    </div>

  </div>

<script>
  // 鼠标移动时更新光晕位置（对应 CSS 里的 .cursor-glow）
  document.addEventListener('mousemove', function (e) {
    document.documentElement.style.setProperty('--mx', e.clientX + 'px');
    document.documentElement.style.setProperty('--my', e.clientY + 'px');
  });
</script>

</body>
</html>
